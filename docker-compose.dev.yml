services:
  api:
    # backend-node replaced the ASP.NET Core API (see backend-node/README.md); the .NET project
    # stops at schema version 28 and lacks every route added by migrations 014-036.
    build:
      context: ./backend-node
    environment:
      NODE_ENV: development
      Authentication__Mode: ${DEV_API_AUTH_MODE:-Development}
      # Read only in TmtId mode; harmless when empty elsewhere.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      TMT_ID_DEFAULT_ROLE_CODE: ${TMT_ID_DEFAULT_ROLE_CODE:-}
      MASTER_DATA_URL: ${MASTER_DATA_URL:-}
      MASTER_DATA_API_KEY: ${MASTER_DATA_API_KEY:-}
      ConnectionStrings__IoTTeamCenter: ${DEV_SQL_CONNECTION_STRING:?set this in .env, copied from .env.dev.example}
      DocumentStorage__RootPath: /app/App_Data/project-documents
      # backend-node validates CORS origins in every environment and accepts plain http only
      # for localhost, so a hostname origin here has to be https (see docker-compose.tls.yml).
      Cors__AllowedOrigins__0: ${DEV_SITE_ORIGIN:-http://localhost:3000}
      AllowedHosts: ${DEV_API_ALLOWED_HOSTS:-localhost;127.0.0.1}
    volumes:
      - api-dev-documents:/app/App_Data/project-documents
    ports:
      - "5105:5106"
    restart: unless-stopped
    # Caps exist because this stack also runs on a shared host (a Mac mini whose colima VM
    # hosts other teams' containers and has no swap): with no limit the Linux OOM killer
    # picks the largest process VM-wide, which is somebody else's database, not us.
    mem_limit: 1g
    logging: &dev-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: node:24-slim
    working_dir: /app
    # Bind-mounts the repo source for hot reload; 'npm run dev' never runs
    # scripts/validate-production-env.mjs, so no HTTPS/Entra values are required to start
    # (login itself still needs a real Entra SPA client id -- see .env.dev.example).
    # 'vinext dev' only reads CLI flags (no PORT/HOST env fallback, unlike 'start'), and
    # its hostname flag is '--hostname'/'-H', not '--host' -- it defaults to binding only
    # 'localhost', which Docker's port mapping cannot reach from outside the container.
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_APP_MODE: development
      NEXT_PUBLIC_AUTH_MODE: ${DEV_FRONTEND_AUTH_MODE:-entra}
      NEXT_PUBLIC_API_BASE_URL: ${DEV_API_BASE_URL:-http://localhost:5105}
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${DEV_ENTRA_TENANT_ID:-}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${DEV_ENTRA_CLIENT_ID:-}
      NEXT_PUBLIC_ENTRA_API_SCOPE: ${DEV_ENTRA_API_SCOPE:-}
      NEXT_PUBLIC_BUSINESS_TIME_ZONE: Asia/Bangkok
      SITE_ORIGIN: ${DEV_SITE_ORIGIN:-http://localhost:3000}
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-}
    volumes:
      - .:/app
      - frontend-dev-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    # 'npm ci' plus the vite dev server spike well past the API's needs.
    mem_limit: 3g
    logging: *dev-logging

volumes:
  api-dev-documents:
  frontend-dev-node-modules:
