name: CI

# Fast checks on every PR and on pushes to integration branches.
# These run in parallel and must complete before any merge is allowed.
# Heavy jobs (Docker builds, SQL integration) live in integration.yml
# and only run when targeting main or develop.

on:
  pull_request:
  push:
    branches:
      - develop
      - "feature/**"
      - "hotfix/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint / typecheck / unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint, typecheck, and unit tests
        run: npm test

  backend-compile:
    name: Node API typecheck, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install Node API dependencies
        working-directory: backend-node
        run: npm ci

      - name: Verify Node API
        working-directory: backend-node
        run: |
          npm run typecheck
          npm test
          npm run build
