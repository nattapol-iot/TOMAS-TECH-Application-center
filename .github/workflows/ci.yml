name: CI

# One workflow so one pick-runner job routes every check.
# Fast checks run on every PR and on pushes to integration branches.
# Heavy checks (Docker builds, SQL acceptance) run only on PRs into main or develop, and by hand.

on:
  pull_request:
  push:
    branches:
      # Deploy waits for this workflow to pass on main (see deploy.yml).
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Same routing as the ERP build: jobs go to the Mac runner (iot-ci, not billed) while it is online and to
  # GitHub-hosted when it is not. When hosted minutes are used up GitHub refuses to start this job;
  # continue-on-error keeps the run green and the empty output sends the jobs to the Mac.
  pick-runner:
    runs-on: ubuntu-24.04
    continue-on-error: true
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      # GITHUB_TOKEN cannot list runners; RUNNER_STATUS_TOKEN needs Administration: read on this repo.
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          online=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status == "online" and any(.labels[]; .name == "iot-ci"))] | length' \
            2>/dev/null || echo 0)
          echo "online iot-ci runners: ${online:-0}"
          if [ "${online:-0}" -gt 0 ]; then
            echo 'runs-on=["self-hosted","iot-ci"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runs-on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
          fi

  lint-typecheck-test:
    name: Lint / typecheck / unit tests
    needs: pick-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on || '["self-hosted","iot-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # The format check compares the PR with its base branch, so it needs the history between them.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Format check (files this PR changes)
        if: github.event_name == 'pull_request'
        run: bun run fmt:check origin/${{ github.base_ref }}

      - name: Lint, typecheck, and unit tests
        run: bun run test

  backend-compile:
    name: Node API typecheck, unit tests and build
    needs: pick-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on || '["self-hosted","iot-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install Node API dependencies
        working-directory: backend-node
        run: bun install --frozen-lockfile

      - name: Verify Node API
        working-directory: backend-node
        run: |
          bun run typecheck
          bun run test
          bun run build

  # Docker image builds prove the production containers still assemble.
  docker-build:
    name: Docker image build check
    needs: pick-runner
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(fromJSON('["main","develop"]'), github.base_ref))) }}
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on || '["self-hosted","iot-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build Node backend Docker image
        run: docker build -f backend-node/Dockerfile -t iot-team-center-api:ci-check .

      - name: Build frontend Docker image
        # Placeholder build ARGs only -- proves the image builds and passes
        # validate-production-env.mjs format checks, not that these are real values.
        # tmt-id is what the shared host builds (docker-compose.tls.yml).
        run: |
          docker build -t iot-team-center-frontend:ci-check . \
            --build-arg NEXT_PUBLIC_APP_MODE=production \
            --build-arg NEXT_PUBLIC_AUTH_MODE=tmt-id \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://ci-check.example.com \
            --build-arg NEXT_PUBLIC_BUSINESS_TIME_ZONE=Asia/Bangkok \
            --build-arg SITE_ORIGIN=https://ci-check.example.com

      - name: Smoke-test both images on Bun
        # The images carry Bun only (no Node), so this proves the API modules load and the
        # frontend serves a page with the runtime production uses.
        run: |
          docker run --rm iot-team-center-api:ci-check bun -e 'await import("./dist/src/startup-migrations.js"); console.log("api modules load")'
          # The Mac runner keeps its Docker state between jobs, so clear a container a cancelled run left behind.
          docker rm -f fe-smoke 2>/dev/null || true
          docker run -d --name fe-smoke -p 3300:3000 iot-team-center-frontend:ci-check
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs fe-smoke | tail -20
          docker rm -f fe-smoke
          [ "$code" = 200 ] || { echo "frontend answered $code"; exit 1; }

  # Runs against a real SQL Server to catch schema and query regressions unit tests cannot.
  node-sql-integration:
    name: Node XLSX, overhead and handover SQL acceptance
    needs: pick-runner
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(fromJSON('["main","develop"]'), github.base_ref))) }}
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on || '["self-hosted","iot-ci"]') }}
    timeout-minutes: 20
    env:
      IOT_RUN_SQL_INTEGRATION: "1"
      IOT_SQL_TEST_SERVER: localhost
      IOT_SQL_TEST_USER: sa
      IOT_SQL_TEST_PASSWORD: "TOMAS_CI!Sql2026#Run"
      SQLCMDPASSWORD: "TOMAS_CI!Sql2026#Run"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        # SQL Server has no arm64 image; the Mac runner VM runs amd64 through Rosetta.
        options: --platform linux/amd64
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "TOMAS_CI!Sql2026#Run"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install Node API dependencies
        working-directory: backend-node
        run: bun install --frozen-lockfile
      - name: Install SQL Server command-line tools
        shell: bash
        run: |
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          # The Mac runner keeps installed packages between jobs.
          [ -x /opt/mssql-tools18/bin/sqlcmd ] && exit 0
          curl -sSL -o "$RUNNER_TEMP/packages-microsoft-prod.deb" \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
      - name: Require isolated SQL Server availability
        shell: bash
        run: |
          for attempt in {1..60}; do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1;"; then
              exit 0
            fi
            sleep 2
          done
          echo "Node SQL acceptance requires the CI SQL service; tests cannot skip." >&2
          exit 1
      - name: Run Node SQL acceptance without skips
        working-directory: backend-node
        run: bun run test:sql-integration
