name: NAS connection verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nas-connect-macmini
  cancel-in-progress: false
jobs:
  nas:
    environment: production
    runs-on: [self-hosted, iot-team-center-macmini]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Mount, verify, migrate, and activate NAS storage
        env:
          NAS_USERNAME: ${{ secrets.NAS_USERNAME }}
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
        run: bash scripts/macos/nas-cutover.sh
