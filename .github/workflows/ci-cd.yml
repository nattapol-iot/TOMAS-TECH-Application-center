name: CI/CD

# Automated on every push and pull request: lint/typecheck/unit tests, a backend
# compile check, and the SQL-backed integration test. Deploying to production is the one
# step that is NOT automatic: it only runs after a push to main, and even then it waits
# for a manual approval in the GitHub "production" Environment before touching the
# server (see docs/CI_CD_SETUP.md for the one-time setup this depends on).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint, typecheck, and unit tests
        run: npm test

      - name: Build backend API
        run: dotnet build backend/IoTTeamCenter.Api/IoTTeamCenter.Api.csproj -c Release

  sql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IOT_SQL_SERVER: localhost
      IOT_SQL_USER: sa
      IOT_SQL_PASSWORD: "TOMAS_CI!Sql2026#Run"
      SQLCMDPASSWORD: "TOMAS_CI!Sql2026#Run"
      IOT_RUN_SQL_INTEGRATION: "1"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "TOMAS_CI!Sql2026#Run"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install SQL Server command-line tools
        shell: bash
        run: |
          curl -sSL -o "$RUNNER_TEMP/packages-microsoft-prod.deb" \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..60}; do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1;"; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready in time." >&2
          exit 1

      - name: Run fresh-database material flow
        run: node --test --test-isolation=none tests/full-material-flow.integration.test.mjs

  deploy:
    needs: [checks, sql-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Requires a "production" Environment configured in this repo's Settings with at
    # least one required reviewer -- that reviewer's approval in the Actions tab IS the
    # "deploy to production or not" gate. See docs/CI_CD_SETUP.md for exact setup steps.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH access to the production host
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync source to the production host
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            --exclude '.vinext' --exclude '.next' --exclude '.wrangler' --exclude '.vercel' \
            --exclude 'backend/IoTTeamCenter.Api/bin' --exclude 'backend/IoTTeamCenter.Api/obj' \
            --exclude 'backend/IoTTeamCenter.Api.Tests/bin' --exclude 'backend/IoTTeamCenter.Api.Tests/obj' \
            -e "ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}:/opt/iot-team-center/src/"

      - name: Deploy backend API
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "sudo /opt/iot-team-center/src/scripts/linux/deploy-release.sh --repo /opt/iot-team-center/src --env-file /etc/iot-team-center/api.env.input"

      - name: Deploy frontend
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "sudo /opt/iot-team-center/src/scripts/linux/deploy-frontend-release.sh --repo /opt/iot-team-center/src --env-file /etc/iot-team-center/frontend.env.input"
