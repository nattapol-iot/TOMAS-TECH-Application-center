name: CI/CD

# Automated on every push and pull request: lint/typecheck/unit tests, a backend
# compile check, and the SQL-backed integration test. Deploying to production is the one
# step that is NOT automatic: it only runs after a push to main, and even then it waits
# for a manual approval in the GitHub "production" Environment before touching the
# server. 'checks' and 'sql-integration' run on GitHub's shared cloud runners as usual;
# 'deploy' runs on a self-hosted runner registered on the production LAN, because the
# production host has no public IP (see docs/CI_CD_SETUP.md for the one-time setup this
# depends on).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint, typecheck, and unit tests
        run: npm test

      - name: Build backend API
        run: dotnet build backend/IoTTeamCenter.Api/IoTTeamCenter.Api.csproj -c Release

      - name: Build backend Docker image
        run: docker build -t iot-team-center-api:ci-check backend/IoTTeamCenter.Api

      - name: Build frontend Docker image
        # Placeholder build ARGs only -- this just proves the image builds and passes
        # validate-production-env.mjs's format checks, not that these are real values.
        # The all-zero GUID is specifically rejected as a placeholder by that validator,
        # so use a syntactically-valid non-zero one instead.
        run: |
          docker build -t iot-team-center-frontend:ci-check . \
            --build-arg NEXT_PUBLIC_APP_MODE=production \
            --build-arg NEXT_PUBLIC_AUTH_MODE=entra \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://ci-check.example.com \
            --build-arg NEXT_PUBLIC_ENTRA_TENANT_ID=11111111-1111-1111-1111-111111111111 \
            --build-arg NEXT_PUBLIC_ENTRA_CLIENT_ID=11111111-1111-1111-1111-111111111111 \
            --build-arg NEXT_PUBLIC_ENTRA_API_SCOPE=api://11111111-1111-1111-1111-111111111111/access_as_user \
            --build-arg NEXT_PUBLIC_BUSINESS_TIME_ZONE=Asia/Bangkok \
            --build-arg SITE_ORIGIN=https://ci-check.example.com

  sql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IOT_SQL_SERVER: localhost
      IOT_SQL_USER: sa
      IOT_SQL_PASSWORD: "TOMAS_CI!Sql2026#Run"
      SQLCMDPASSWORD: "TOMAS_CI!Sql2026#Run"
      IOT_RUN_SQL_INTEGRATION: "1"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "TOMAS_CI!Sql2026#Run"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install SQL Server command-line tools
        shell: bash
        run: |
          curl -sSL -o "$RUNNER_TEMP/packages-microsoft-prod.deb" \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..60}; do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1;"; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready in time." >&2
          exit 1

      - name: Run fresh-database material flow
        run: node --test --test-isolation=none tests/full-material-flow.integration.test.mjs

  deploy:
    needs: [checks, sql-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # This job runs ON the production LAN itself, via a self-hosted runner registered
    # to this repo (see docs/CI_CD_SETUP.md) -- the production host has no public IP
    # (it's a VM hosted on an office/home NAS behind a router), so a GitHub-hosted
    # cloud runner can never reach it over SSH. The self-hosted runner instead makes
    # an outbound-only connection to GitHub to pick up jobs, so no inbound port or
    # VPN is needed. The 'iot-team-center-production' label targets specifically that
    # runner, never GitHub's shared cloud pool.
    runs-on: [self-hosted, iot-team-center-production]
    timeout-minutes: 20
    # Requires a "production" Environment configured in this repo's Settings with at
    # least one required reviewer -- that reviewer's approval in the Actions tab IS the
    # "deploy to production or not" gate. This still applies identically on a
    # self-hosted runner: the job waits for approval before it is ever dispatched.
    # See docs/CI_CD_SETUP.md for exact setup steps.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Sync checkout into the deploy path
        # Same machine, so this is a local copy, not a network transfer -- no SSH keys
        # or known_hosts needed. Runs as the runner's own service account, which
        # install-production-host.sh's --deploy-user already owns this path for.
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            --exclude '.vinext' --exclude '.next' --exclude '.wrangler' --exclude '.vercel' \
            --exclude 'backend/IoTTeamCenter.Api/bin' --exclude 'backend/IoTTeamCenter.Api/obj' \
            --exclude 'backend/IoTTeamCenter.Api.Tests/bin' --exclude 'backend/IoTTeamCenter.Api.Tests/obj' \
            ./ /opt/iot-team-center/src/

      - name: Build and deploy (Docker Compose)
        # Permitted without a password by the narrowly-scoped sudoers entry
        # install-production-host.sh writes for --deploy-user (deploy.sh/rollback.sh
        # under /opt/iot-team-center/src only -- not blanket sudo). Running as root via
        # sudo already gives deploy.sh's 'docker compose'/'docker build' commands access
        # to the Docker daemon, so the runner's own account never needs 'docker' group
        # membership.
        run: sudo /opt/iot-team-center/src/scripts/linux/deploy.sh --repo /opt/iot-team-center/src --api-env-file /etc/iot-team-center/api.env.input --frontend-env-file /etc/iot-team-center/frontend.env.input

  deploy-macmini:
    needs: [checks]
    # Development-mode team instance on the shared Mac mini (docs/MACMINI_HANDOFF.md). Gated on
    # checks only: sql-integration exercises a throwaway SQL 2022 service container and has
    # been flaky, and a red integration run must not block a dev deploy the way it blocks
    # production above. Every merge to main ships; there is no approval environment here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, iot-team-center-macmini]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build and deploy (colima iot profile)
        # Runs as the runner's login user, which owns the colima socket; deploy.sh syncs this
        # checkout into the deploy dir that carries the untracked .env and rebuilds there.
        run: scripts/macos/deploy.sh --source "$GITHUB_WORKSPACE"
