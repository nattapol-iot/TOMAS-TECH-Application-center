name: Deploy

# Production deployment to the Mac mini (macmini-1 / tmt-eq-0056).
# Triggered by a push to main after a PR is merged.
# The job waits for manual approval in the GitHub "production" Environment
# before being dispatched to the self-hosted runner registered on the Mac mini.
# The runner (label: iot-team-center-macmini) makes an outbound-only connection
# to GitHub — no inbound port, no public IP, no VPN needed.
# See docs/MACMINI_HANDOFF.md for host layout and constraints.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Mac mini (colima-iot)
    # Runner registered on macmini-1 at /Users/tomastc/actions-runner
    # launchd service: actions.runner.pattana1902-IoT-Team-Center.macmini-1
    runs-on: [self-hosted, iot-team-center-macmini]
    timeout-minutes: 20
    # Requires a "production" Environment in repo Settings with at least one
    # required reviewer. Approval in the Actions tab is the deploy gate.
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Deploy via macOS script
        # scripts/macos/deploy.sh handles rsync, colima-iot Docker context,
        # --force-recreate, Caddy reload, and health checks itself.
        # It reads .env from ~/iot-team-center/src (preserved across deploys by
        # rsync --exclude .env in the script). No sudo needed: the colima socket
        # lives under the tomastc home directory.
        # See docs/MACMINI_HANDOFF.md § "Bringing this repo up".
        run: scripts/macos/deploy.sh --source "$GITHUB_WORKSPACE"
