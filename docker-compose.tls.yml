# Overlay for docker-compose.dev.yml that turns it into the shared-host deployment: Caddy in
# front of both services with real certificates, a production-built frontend, and identity
# settings that must be stated rather than defaulted. The app is reached as
# https://$PUBLIC_HOST:$TLS_FRONTEND_PORT (and the API on $TLS_API_PORT) without exposing the
# plain-http ports beyond the host itself:
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.tls.yml up -d
#
# scripts/macos/deploy.sh is the only caller. DEV_API_BASE_URL and DEV_SITE_ORIGIN in .env
# must be the https URLs; they are compiled into the frontend bundle at build time.
services:
  api:
    ports: !override
      - "127.0.0.1:5105:5106"
    environment:
      # Caddy, on the private compose network, is the only way in. Believe its
      # X-Forwarded-For so the per-address limit sees each client, not the proxy.
      Http__TrustProxy: uniquelocal
      # The dev file falls back to Development, which trusts an x-dev-user-email header from
      # anyone. On the shared host a missing value must stop compose instead.
      Authentication__Mode: ${DEV_API_AUTH_MODE:?set DEV_API_AUTH_MODE=TmtId in .env on the shared host}
      # TMTHub: the Download Center's repositories once deploy.sh has issued the token; empty, the
      # Download Center keeps plain NAS folders.
      TMTHUB_API_URL: http://tmthub:3000
      TMTHUB_API_TOKEN: ${TMTHUB_API_TOKEN:-}
      TMTHUB_ORG: ${TMTHUB_ORG:-TMT}
      TMTHUB_PUBLIC_URL: https://${TMTHUB_HOST:-tmthub.tomastc.com}:${TMTHUB_PORT:-8446}
      # Site credentials vault key ring, generated once by scripts/macos/deploy.sh into .env. Losing it
      # makes every stored site secret unreadable: keep a copy outside this host (docs/CREDENTIAL_VAULT.md).
      CREDENTIAL_VAULT_KEYS: ${CREDENTIAL_VAULT_KEYS:-}

  frontend:
    # The dev file bind-mounts the checkout and runs 'npm run dev', and a Vite dev server
    # answers any path under the project root -- source, docs and /demo -- without sign-in.
    # Here the image is built from ./Dockerfile and serves only the compiled dist/.
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_MODE: production
        NEXT_PUBLIC_AUTH_MODE: ${DEV_FRONTEND_AUTH_MODE:?set DEV_FRONTEND_AUTH_MODE=tmt-id in .env on the shared host}
        NEXT_PUBLIC_API_BASE_URL: ${DEV_API_BASE_URL:?set DEV_API_BASE_URL to the https API origin}
        NEXT_PUBLIC_ENTRA_TENANT_ID: ${DEV_ENTRA_TENANT_ID:-}
        NEXT_PUBLIC_ENTRA_CLIENT_ID: ${DEV_ENTRA_CLIENT_ID:-}
        NEXT_PUBLIC_ENTRA_API_SCOPE: ${DEV_ENTRA_API_SCOPE:-}
        NEXT_PUBLIC_BUSINESS_TIME_ZONE: Asia/Bangkok
        SITE_ORIGIN: ${DEV_SITE_ORIGIN:?set DEV_SITE_ORIGIN to the https site origin}
    image: iot-team-center-frontend:current
    command: !reset null
    volumes: !reset []
    environment: !override
      SITE_ORIGIN: ${DEV_SITE_ORIGIN:?set DEV_SITE_ORIGIN to the https site origin}
    ports: !override
      - "127.0.0.1:3000:3000"
    # 'vinext start' serves prebuilt files; the 3g in the dev file was for 'npm ci' plus Vite.
    mem_limit: 1g

  caddy:
    # Same build the rest of this host already runs; the stock caddy image has no DNS plugin.
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?public hostname whose A record points at this host}
      TLS_FRONTEND_PORT: ${TLS_FRONTEND_PORT:-8444}
      TLS_API_PORT: ${TLS_API_PORT:-8445}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Cloudflare token with Zone.DNS edit on the PUBLIC_HOST zone}
      TMTHUB_HOST: ${TMTHUB_HOST:-tmthub.tomastc.com}
      TMTHUB_PORT: ${TMTHUB_PORT:-8446}
    volumes:
      # Directory, not file: rsync replaces files by rename and a single-file bind mount would
      # keep serving the old inode, so reloads would never see an updated Caddyfile.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${TLS_FRONTEND_PORT:-8444}:${TLS_FRONTEND_PORT:-8444}"
      - "${TLS_API_PORT:-8445}:${TLS_API_PORT:-8445}"
      - "${TMTHUB_PORT:-8446}:${TMTHUB_PORT:-8446}"
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # TMTHub: the department git server (Forgejo), clone/push/pull over HTTPS behind Caddy on
  # https://$TMTHUB_HOST:$TMTHUB_PORT. Sign-in is TMT ID only; git uses personal access tokens.
  #
  # Repositories, LFS objects and attachments live on the NAS, mounted over NFS by the iot VM's
  # kernel (volume tmthub-nas, no password: the NAS authorises this host's address). Not through
  # the Mac's /private/tmp SMB mount: macOS smbfs writes AppleDouble "._*" companions, and a
  # "._pack-*.idx" beside a pack is read by git as a corrupt index. Only the SQLite database stays
  # on the VM disk (SQLite over a network share corrupts under locking); tmthub-backup copies it
  # to the NAS.
  #
  # Profile "tmthub": scripts/macos/deploy.sh starts these after the application is healthy, so a
  # NAS or TMTHub problem can never stop the application from deploying.
  tmthub:
    image: codeberg.org/forgejo/forgejo:15.0.9
    profiles: [tmthub]
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__DEFAULT__APP_NAME: TMTHub
      FORGEJO__DEFAULT__APP_SLOGAN: Tomas Tech source code
      FORGEJO__server__DOMAIN: ${TMTHUB_HOST:-tmthub.tomastc.com}
      FORGEJO__server__ROOT_URL: https://${TMTHUB_HOST:-tmthub.tomastc.com}:${TMTHUB_PORT:-8446}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__server__LFS_START_SERVER: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__repository__ROOT: /nas/repositories
      FORGEJO__lfs__PATH: /nas/lfs
      FORGEJO__attachment__PATH: /nas/attachments
      FORGEJO__security__INSTALL_LOCK: "true"
      # Generated once by scripts/macos/deploy.sh into .env; it encrypts stored OAuth secrets.
      FORGEJO__security__SECRET_KEY: ${TMTHUB_SECRET_KEY:?scripts/macos/deploy.sh generates TMTHUB_SECRET_KEY in .env}
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      FORGEJO__service__SHOW_REGISTRATION_BUTTON: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      FORGEJO__service__ENABLE_NOTIFY_MAIL: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      # TMT ID accounts register on first sign-in and link to a pre-created account by email.
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      FORGEJO__oauth2_client__USERNAME: email
      FORGEJO__oauth2_client__ACCOUNT_LINKING: auto
      FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES: email profile
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__session__COOKIE_SECURE: "true"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__cron_0X2E_update_checker__ENABLED: "false"
      # Single-threaded pack indexing. index-pack's worker threads re-open the pack it is still
      # writing, and over the NAS's NFS mount they read short ("premature end of pack file, N bytes
      # missing" on every push with deltas). One thread reads through the writer's own descriptor.
      FORGEJO__git_0X2E_config__pack_0X2E_threads: "1"
      FORGEJO__log__LEVEL: Warn
      # Also to a file in the data volume, so problems outlive the container (deploy.sh reports them).
      FORGEJO__log__MODE: console, file
      FORGEJO__log__ROOT_PATH: /data/gitea/log
      FORGEJO__log_0X2E_file__MAX_SIZE_SHIFT: "24"
      FORGEJO__log_0X2E_file__MAX_DAYS: "14"
      FORGEJO__time__DEFAULT_UI_LOCATION: Asia/Bangkok
    volumes:
      - tmthub-data:/data
      - tmthub-nas:/nas
    restart: unless-stopped
    # The iot VM has 4 GiB and no swap; Forgejo idles near 150 MB.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The database (and app.ini) onto the NAS at every deploy and daily, keeping the newest 14; the
  # repositories are on the NAS already and are not copied again.
  tmthub-backup:
    image: codeberg.org/forgejo/forgejo:15.0.9
    profiles: [tmthub]
    entrypoint: ["/bin/sh", "/opt/tmthub/backup.sh"]
    environment:
      TMTHUB_BACKUP_KEEP: "14"
    volumes:
      - tmthub-data:/data
      - tmthub-nas:/nas
      - ./deploy/tmthub:/opt/tmthub:ro
    depends_on:
      - tmthub
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
  tmthub-data:
  # <NAS>:/volume1/IoT Department/IoT Team Center/TMTHub over NFSv4.1. The NAS rule must allow
  # this host read/write, map all users to one account, accept non-privileged ports (the VM is
  # behind NAT) and allow mounting subfolders. deploy.sh removes this mount-only volume before
  # each start because volume options are fixed at creation; the data on the NAS is untouched.
  tmthub-nas:
    driver: local
    driver_opts:
      type: nfs
      # deploy.sh probes which path and protocol the NAS accepts (NAS vendors differ: full path
      # or NFSv4 pseudo-root, v4.1 or v3) and exports the pair that mounts.
      o: "addr=${TMTHUB_NAS_ADDR:-100.64.0.53},${TMTHUB_NFS_OPTIONS:-rw,nfsvers=4.1,hard,timeo=600,retrans=2,noresvport}"
      device: ":${TMTHUB_NFS_PATH:-/volume1/IoT Department/IoT Team Center/TMTHub}"
